; unsteam yapılandırması
; Bu dosyayı RF-Yama arayüzünden düzenleyebilirsiniz. Elle düzenlerseniz yorumlar korunur.
; Dosya BOM'suz UTF-8 olarak saklanmalıdır.

[loader]
; Başlatılacak oyunun .exe dosyası. RF-Yama hedef klasörü tarayıp otomatik doldurur.
exe_file=
; Oyuna yüklenecek yama DLL'i.
dll_file=unsteam.dll

[game]
; 1 = oyun hiçbir ağ bağlantısı kurmaya çalışmaz.
offline_mode=0

; 0 bırakılırsa otomatik atanır. Çok oyunculu oturumda oyuncuyu ayırt eden numara.
steam_id=0

; Diğer oyuncuların göreceği ad. Türkçe karakter kullanılabilir.
player_name=

; Oyunun gerçek Steam AppID'si. RF-Yama bunu yerel Steam kurulum kaydından tespit edebilir.
real_app_id=0

; Steam istemcisine bildirilen kimlik. 480 (Spacewar) çakışmayı önler, değiştirmeye gerek yok.
fake_app_id=480

; Oyuna bildirilecek dil.
language=turkish

; Oyunun sürüm dalı. Normalde public kalır.
beta_name=public

; Kayıt dosyalarının konumu. Boş bırakılırsa varsayılan kullanılır.
saves_path=

; Oyuna geçirilecek komut satırı parametreleri.
game_launch_options=
